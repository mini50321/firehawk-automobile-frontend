server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Angular's build hashes JS/CSS/font filenames, so they're safe to cache
  # indefinitely — a new deploy ships under new filenames.
  location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must always be revalidated, otherwise browsers/CDNs could keep
  # serving a stale shell that references assets from a previous deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: let Angular's router handle any path that isn't a
  # real file on disk.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
